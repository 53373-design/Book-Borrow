<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="bg-slate-900 min-h-screen text-slate-100 p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex items-center gap-3 bg-slate-800 p-6 rounded-2xl border border-slate-700/50 shadow-xl">
      <div class="p-3 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-book-bookmark text-2xl text-white"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Library Manager Pro</h1>
        <p class="text-xs text-slate-400">ระบบจัดการยืม-คืนหนังสือ (กดที่ชื่อผู้แต่งเพื่อแก้ไขได้ทันที)</p>
      </div>
    </header>

    <!-- Inline Form: เพิ่มหนังสือใหม่ -->
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700/60 shadow-lg space-y-3">
      <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-plus text-indigo-400"></i> เพิ่มหนังสือใหม่เข้าคลัง
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
        <input id="addTitleInput" type="text" placeholder="ชื่อหนังสือ" class="sm:col-span-2 px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        <input id="addAuthorInput" type="text" placeholder="ชื่อผู้แต่ง" class="sm:col-span-2 px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        <button id="confirmAddBtn" type="button" class="sm:col-span-1 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold text-white shadow-md transition-all">
          บันทึก
        </button>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/50 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">หนังสือทั้งหมด</p>
          <p id="totalCount" class="text-3xl font-extrabold mt-1 text-white">0</p>
        </div>
        <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-book"></i></div>
      </div>
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/50 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">พร้อมใช้งาน</p>
          <p id="availableCount" class="text-3xl font-extrabold mt-1 text-emerald-400">0</p>
        </div>
        <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-circle-check"></i></div>
      </div>
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/50 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">ถูกยืมอยู่</p>
          <p id="borrowedCount" class="text-3xl font-extrabold mt-1 text-amber-400">0</p>
        </div>
        <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
      </div>
    </div>

    <!-- Books Grid -->
    <div id="booksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

  </div>
</div>

<script>
  let books = [
    { id: 1, title: 'การเวลา', author: 'หก์หง', isBorrowed: false, borrower: '', borrowDate: '' },
    { id: 2, title: 'Clean Code', author: 'Robert C. Martin', isBorrowed: false, borrower: '', borrowDate: '' },
    { id: 3, title: 'Atomic Habits', author: 'James Clear', isBorrowed: true, borrower: 'สมชาย', borrowDate: '2026-08-20' }
  ];

  function render() {
    const booksGrid = document.getElementById('booksGrid');
    const totalCount = document.getElementById('totalCount');
    const availableCount = document.getElementById('availableCount');
    const borrowedCount = document.getElementById('borrowedCount');

    totalCount.textContent = books.length;
    availableCount.textContent = books.filter(b => !b.isBorrowed).length;
    borrowedCount.textContent = books.filter(b => b.isBorrowed).length;

    booksGrid.innerHTML = books.map(book => `
      <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 flex flex-col justify-between shadow-lg">
        <div>
          <div class="flex justify-between items-start gap-2 mb-3">
            <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold tracking-wide uppercase border ${
              book.isBorrowed ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
            }">
              ${book.isBorrowed ? 'ถูกยืม' : 'ว่าง'}
            </span>
            <button onclick="deleteBook(${book.id})" class="text-slate-500 hover:text-rose-400 p-1">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
          <h3 class="font-bold text-lg text-slate-100 mb-2">${book.title}</h3>
          
          <!-- ช่องแก้ไขชื่อผู้แต่ง -->
          <div class="flex items-center gap-1.5 mb-4 text-sm text-slate-400">
            <i class="fa-regular fa-user text-xs"></i>
            <input type="text" value="${book.author}" onchange="updateAuthor(${book.id}, this.value)" 
                   class="bg-transparent hover:bg-slate-900 focus:bg-slate-900 border border-transparent hover:border-slate-700 focus:border-indigo-500 rounded px-1.5 py-0.5 text-slate-300 focus:text-white text-sm transition-all focus:outline-none w-full"
                   title="คลิกเพื่อแก้ไขชื่อผู้แต่ง">
          </div>
        </div>

        <div class="pt-4 border-t border-slate-700/50">
          ${book.isBorrowed ? `
            <div class="mb-3 bg-slate-900/60 p-2.5 rounded-xl text-xs space-y-1">
              <p class="text-slate-400">ผู้ยืม: <span class="text-slate-200 font-medium">${book.borrower}</span></p>
              <p class="text-slate-500 text-[11px]">วันที่ยืม: ${book.borrowDate}</p>
            </div>
            <button onclick="returnBook(${book.id})" class="w-full py-2 bg-slate-700 hover:bg-amber-600 text-slate-200 rounded-xl text-sm font-semibold transition-all">
              คืนหนังสือ
            </button>
          ` : `
            <div class="space-y-2">
              <input id="input-borrower-${book.id}" type="text" placeholder="พิมพ์ชื่อผู้ยืม..." class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
              <button onclick="borrowBook(${book.id})" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-semibold transition-all shadow-md shadow-emerald-600/20">
                ยืนยันยืม
              </button>
            </div>
          `}
        </div>
      </div>
    `).join('');
  }

  // อัปเดตชื่อผู้แต่งเมื่อพิมพ์เปลี่ยนแล้วกด Enter หรือคลิกข้างนอก
  window.updateAuthor = function(id, newAuthor) {
    const book = books.find(b => b.id === id);
    if (book) {
      book.author = newAuthor.trim() || 'ไม่ระบุผู้แต่ง';
    }
  };

  window.borrowBook = function(id) {
    const input = document.getElementById(`input-borrower-${id}`);
    const name = input ? input.value.trim() : '';

    if (!name) {
      alert('กรุณาพิมพ์ชื่อผู้ยืมก่อนครับ');
      return;
    }

    const book = books.find(b => b.id === id);
    if (book) {
      book.isBorrowed = true;
      book.borrower = name;
      book.borrowDate = new Date().toISOString().split('T')[0];
    }
    render();
  };

  window.returnBook = function(id) {
    const book = books.find(b => b.id === id);
    if (book) {
      book.isBorrowed = false;
      book.borrower = '';
      book.borrowDate = '';
    }
    render();
  };

  window.deleteBook = function(id) {
    books = books.filter(b => b.id !== id);
    render();
  };

  document.getElementById('confirmAddBtn').addEventListener('click', () => {
    const titleInput = document.getElementById('addTitleInput');
    const authorInput = document.getElementById('addAuthorInput');
    const title = titleInput.value.trim();
    const author = authorInput.value.trim();

    if (!title || !author) {
      alert('กรุณากรอกชื่อหนังสือและชื่อผู้แต่งให้ครบถ้วน');
      return;
    }

    books.unshift({
      id: Date.now(),
      title: title,
      author: author,
      isBorrowed: false,
      borrower: '',
      borrowDate: ''
    });

    titleInput.value = '';
    authorInput.value = '';
    render();
  });

  render();
</script>
