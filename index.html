<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Manager Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex items-center gap-3 bg-slate-800 p-6 rounded-2xl border border-slate-700/50 shadow-xl">
      <div class="p-3 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-book-bookmark text-2xl text-white"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Library Manager Pro</h1>
        <p class="text-xs text-slate-400">ระบบจัดการยืม-คืนหนังสือ (กดที่ชื่อผู้แต่งเพื่อแก้ไขได้ทันที)</p>
      </div>
    </header>

    <!-- Form: เพิ่มหนังสือใหม่ -->
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700/60 shadow-lg space-y-3">
      <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-plus text-indigo-400"></i> เพิ่มหนังสือใหม่เข้าคลัง
      </h3>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <input id="addTitleInput" type="text" placeholder="ชื่อหนังสือ *" class="px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        <input id="addAuthorInput" type="text" placeholder="ชื่อผู้แต่ง *" class="px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        <input id="addGenreInput" type="text" placeholder="หมวดหมู่" class="px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        <input id="addIsbnInput" type="text" placeholder="ISBN" class="px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <input id="addYearInput" type="number" placeholder="ปีพิมพ์ (เช่น 2024)" class="px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        <input id="addQuantityInput" type="number" min="1" placeholder="จำนวนเล่มในคลัง" class="px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        <input id="addDescriptionInput" type="text" placeholder="คำอธิบายหนังสือ" class="lg:col-span-2 px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
      </div>

      <button id="confirmAddBtn" type="button" class="w-full sm:w-auto px-6 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold text-white shadow-md transition-all">
        <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกหนังสือ
      </button>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/50 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">หนังสือทั้งหมด</p>
          <p id="totalCount" class="text-3xl font-extrabold mt-1 text-white">0</p>
        </div>
        <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-book"></i></div>
      </div>
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/50 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">พร้อมใช้งาน</p>
          <p id="availableCount" class="text-3xl font-extrabold mt-1 text-emerald-400">0</p>
        </div>
        <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-circle-check"></i></div>
      </div>
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700/50 flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">ถูกยืมอยู่</p>
          <p id="borrowedCount" class="text-3xl font-extrabold mt-1 text-amber-400">0</p>
        </div>
        <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
      </div>
    </div>

    <!-- Books Grid -->
    <div id="booksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
